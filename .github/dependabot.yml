version: 2
updates:
  # Blowfish theme (Git submodule in themes/blowfish). Review its release notes
  # and rebuild before merging.
  - package-ecosystem: gitsubmodule
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(theme)"

  # Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(actions)"
