name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "LICENSE-content"
      - ".syndication/**"
  workflow_dispatch:

permissions: {}

# One deployment at a time; a newer run waits instead of cancelling a
# deployment that is already in progress.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.167.0
  PYTHON_VERSION: "3.12"
  TZ: Europe/Istanbul

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # actions/configure-pages reads the Pages site settings
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the linter's dependencies
        run: python -m pip install pyyaml==6.0.2 jsonschema==4.23.0 pillow==11.0.0

      - name: Lint posts
        run: python scripts/lint_posts.py --format github

      - name: Install Hugo extended ${{ env.HUGO_VERSION }}
        run: |
          wget -q -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
          hugo version

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Cache processed images
        uses: actions/cache@v6
        with:
          path: |
            resources/_gen
            ${{ runner.temp }}/hugo_cache
          key: hugo-${{ env.HUGO_VERSION }}-${{ hashFiles('content/**/*.webp', 'content/**/*.png', 'content/**/*.svg', 'assets/**') }}
          restore-keys: hugo-${{ env.HUGO_VERSION }}-

      - name: Snapshot the live sitemap
        run: python scripts/indexnow.py snapshot

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          # Optional IDs from repository variables (Settings > Secrets and
          # variables > Actions > Variables). Unset variables render nothing.
          HUGO_PARAMS_ANALYTICS_GA4: ${{ vars.GA4_ID }}
          HUGO_PARAMS_ANALYTICS_CLARITY: ${{ vars.CLARITY_ID }}
          HUGO_PARAMS_ANALYTICS_CFBEACONTOKEN: ${{ vars.CF_BEACON_BLOG }}
          HUGO_PARAMS_VERIFICATION_GOOGLE: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          HUGO_PARAMS_VERIFICATION_BING: ${{ vars.BING_SITE_VERIFICATION }}
          HUGO_PARAMS_VERIFICATION_YANDEX: ${{ vars.YANDEX_VERIFICATION }}
          HUGO_PARAMS_GISCUS_REPOID: ${{ vars.GISCUS_REPO_ID }}
          HUGO_PARAMS_GISCUS_CATEGORYID: ${{ vars.GISCUS_CATEGORY_ID }}
        run: hugo --gc --minify

      - name: Check old URLs
        run: python scripts/check-old-urls.py

      - name: Check internal links
        run: python scripts/check_links.py

      - name: List changed URLs
        run: python scripts/indexnow.py diff

      - name: Keep the changed-URL list for the notify job
        uses: actions/upload-artifact@v7
        with:
          name: indexnow
          path: .indexnow/changed.txt
          include-hidden-files: true
          retention-days: 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  notify:
    # Tell IndexNow (Bing, Yandex and others) about new or changed pages and
    # ping the WebSub hub so feed readers pick up new posts right away.
    # A failure here never fails the deployment.
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts
            config
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: indexnow
          path: .indexnow
      - name: Submit to IndexNow
        continue-on-error: true
        env:
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
        run: python scripts/indexnow.py submit
      - name: Ping the WebSub hub
        continue-on-error: true
        run: |
          site=$(python -c 'import sys; sys.path.insert(0, "scripts"); import common; print(common.base_url())')
          for feed in "${site}feed.xml" "${site}en/feed.xml"; do
            curl -fsS -d hub.mode=publish --data-urlencode "hub.url=$feed" https://pubsubhubbub.appspot.com/ || true
          done
