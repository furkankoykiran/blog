name: Lint

# Pull request checks: script lint and tests, the post linter (with its
# git-aware rules for changed posts), a full Hugo build that fails on warnings,
# and the old-URL, internal-link and blocklist checks.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: 0.167.0
  PYTHON_VERSION: "3.12"
  TZ: Europe/Istanbul

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out (with the theme submodule and history for the git-aware rules)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the linter's dependencies
        run: python -m pip install pyyaml==6.0.2 jsonschema==4.23.0 pillow==11.0.0 ruff==0.17.2

      - name: Lint and format-check the scripts
        run: |
          ruff check scripts tests
          ruff format --check scripts tests

      - name: Linter tests
        run: python -m unittest discover -s tests -v

      - name: Lint all posts
        run: python scripts/lint_posts.py --format github --summary

      - name: Lint changed posts (lastmod, date and slug rules)
        if: github.event_name == 'pull_request'
        run: python scripts/lint_posts.py --format github --changed-only "origin/${{ github.base_ref }}"

      - name: Diagrams are pre-rendered
        run: python scripts/render_diagrams.py check

      - name: No blocked terms in the repository
        run: python scripts/blocklist.py check .

      - name: Install Hugo extended ${{ env.HUGO_VERSION }}
        run: |
          wget -q -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
          hugo version

      - name: Build (production, warnings fail the build)
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --panicOnWarning

      - name: Old URLs still resolve
        run: python scripts/check-old-urls.py

      - name: Internal links resolve
        run: python scripts/check_links.py
