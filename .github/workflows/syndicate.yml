name: Cross-post to dev.to

# English posts go to dev.to with the blog as the canonical URL, a few days
# after they appear here so search engines index the original first.
on:
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]
  schedule:
    - cron: "40 */6 * * *" # picks up posts once their delay has passed
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would be posted"
        type: boolean
        default: true
      since:
        description: "Include posts dated on or after this day (YYYY-MM-DD)"
        required: false

permissions: {}

concurrency:
  group: syndicate
  cancel-in-progress: false

jobs:
  devto:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commits .syndication/state.json
      issues: write # opens an issue when a run fails
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cross-post
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          SYNDICATION_DELAY_DAYS: ${{ vars.SYNDICATION_DELAY_DAYS || '3' }}
          SYNDICATE_SINCE: ${{ inputs.since || vars.SYNDICATE_SINCE || '2026-10-25' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python scripts/syndicate_devto.py --dry-run
          else
            python scripts/syndicate_devto.py
          fi

      - name: Save the dev.to article ids
        if: always() && inputs.dry_run != true
        run: |
          if [ -n "$(git status --porcelain .syndication/state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .syndication/state.json
            git commit -m "chore: update dev.to syndication state [skip ci]"
            git push
          fi

      - name: Open an issue if something failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="The dev.to cross-post run failed: $RUN_URL"
          if [ -f .syndication/errors.txt ]; then
            body="$body"$'\n\n```\n'"$(cat .syndication/errors.txt)"$'\n```'
          fi
          gh issue create --title "dev.to cross-post failed" --body "$body" || true
