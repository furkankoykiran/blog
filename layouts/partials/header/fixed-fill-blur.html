{{- /* Theme's fixed-fill-blur header without background-blur.js: the glass background is always on (no scroll listener, no forced reflow). */ -}}
<div class="fk-header-spacer" aria-hidden="true"></div>
<div class="fixed top-0 inset-x-0 z-100">
  <div
    id="menu-blur"
    class="absolute inset-x-0 top-0 h-full single_hero_background nozoom backdrop-blur-2xl backdrop-saturate-220 backdrop-brightness-112 dark:backdrop-saturate-180 dark:backdrop-brightness-95 bg-primary-200/80 bg-linear-60 dark:bg-primary-800/30 shadow-xl"></div>
  <div class="relative m-auto leading-7 max-w-7xl px-6 sm:px-14 md:px-24 lg:px-32">
    {{ partial "header/basic.html" . }}
  </div>
</div>
