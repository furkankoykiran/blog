<!doctype html>
<!--
  annotated-shot: the relevant part of a screenshot with 1-3 numbered markers and a legend.
  Data keys: kicker, title, image (path relative to the data file), crop{x, y, w, h} in source pixels,
  markers[{x, y, text}] in source pixels, takeaway, height.
  render.py turns `image` into a file:// URL. Crop tightly: only the part the legend talks about.
-->
<html lang="en"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Inter";src:url("../../../assets/fonts/Inter-Medium.ttf");font-weight:500}
@font-face{font-family:"Inter";src:url("../../../assets/fonts/Inter-SemiBold.ttf");font-weight:600}
@font-face{font-family:"IBM Plex Mono";src:url("../../../assets/fonts/IBMPlexMono-Medium.ttf");font-weight:500}
@font-face{font-family:"Inter Display";src:url("../../../assets/fonts/InterDisplay-Bold.ttf");font-weight:700}
:root{--navy:#11151D;--teal:#2DD4BF;--teal-ink:#0F766E;--amber:#FBBF24;--amber-bg:#FEF5DC;
  --ink:#11151D;--muted:#566070;--bg:#F5F7FA;--card:#FFFFFF;--line:#DCE2EA;
  --mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
#card{width:1280px;height:720px;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);
  font:500 30px/1.4 "Inter",sans-serif;overflow:hidden}
.bar{background:var(--navy);color:#fff;padding:36px 64px 34px;position:relative;flex:none}
.bar::after{content:"";position:absolute;left:64px;bottom:0;width:140px;height:6px;background:var(--teal);border-radius:3px 3px 0 0}
.kicker{font:600 28px/1 "Inter";letter-spacing:.03em;color:var(--teal)}
h1{font:700 54px/1.12 "Inter Display";letter-spacing:-.01em;margin-top:14px}
main{flex:1;min-height:0;padding:40px 64px 0;display:grid;grid-template-columns:1fr 360px;gap:40px}
.take{flex:none;margin:28px 64px 36px;padding:22px 30px;border-left:8px solid var(--amber);background:var(--amber-bg);
  border-radius:0 14px 14px 0;font:600 30px/1.35 "Inter"}
code{font-family:var(--mono);font-weight:500;font-size:.92em}
strong{font-weight:600}

.frame{position:relative;min-height:0;background:var(--card);border:2px solid var(--line);border-radius:20px;overflow:hidden}
.shot{position:absolute;overflow:hidden}
.shot img{position:absolute;max-width:none}
.pin{position:absolute;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:var(--amber);color:var(--navy);
  font:700 30px/52px "Inter Display";text-align:center;border:3px solid var(--navy);box-shadow:0 0 0 5px #fff,0 6px 16px rgba(17,21,29,.28)}
.legend{list-style:none;display:flex;flex-direction:column;justify-content:center;gap:30px}
.legend li{display:grid;grid-template-columns:58px 1fr;gap:22px;align-items:start;font:500 29px/1.35 "Inter"}
.legend .pin{position:static;margin:0;box-shadow:none}
</style></head>
<body><div id="card">
  <div class="bar"><div class="kicker" id="kicker"></div><h1 id="title"></h1></div>
  <main><div class="frame" id="frame"><div class="shot" id="shot"><img id="img" alt=""></div></div><ol class="legend fit" id="legend"></ol></main>
  <div class="take" id="take"></div>
</div>
<script>
const D = window.DATA || {};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
document.documentElement.lang = D.lang || "en";
const card = document.getElementById("card");
card.style.width = (D.width || 1280) + "px";
// Without an explicit height the card grows with its content (at least 16:9).
if (D.height) card.style.height = D.height + "px";
else { card.style.height = "auto"; card.style.minHeight = "720px"; }
document.getElementById("kicker").innerHTML = md(D.kicker);
document.getElementById("title").innerHTML = md(D.title);
const take = document.getElementById("take");
if (D.takeaway) take.innerHTML = md(D.takeaway); else take.remove();
const markers = D.markers || [];
document.getElementById("legend").innerHTML = markers.map((m, i) =>
  `<li><span class="pin">${i + 1}</span><span>${md(m.text)}</span></li>`).join("");
const img = document.getElementById("img");
img.onload = () => {
  const frame = document.getElementById("frame"), shot = document.getElementById("shot");
  const c = D.crop || {x: 0, y: 0, w: img.naturalWidth, h: img.naturalHeight};
  const pad = 36, fw = frame.clientWidth - 2 * pad, fh = frame.clientHeight - 2 * pad;
  const k = Math.min(fw / c.w, fh / c.h);
  const w = c.w * k, h = c.h * k;
  Object.assign(shot.style, {left: (pad + (fw - w) / 2) + "px", top: (pad + (fh - h) / 2) + "px", width: w + "px", height: h + "px"});
  Object.assign(img.style, {width: img.naturalWidth * k + "px", left: -c.x * k + "px", top: -c.y * k + "px"});
  markers.forEach((m, i) => frame.insertAdjacentHTML("beforeend",
    `<span class="pin" style="left:${pad + (fw - w) / 2 + (m.x - c.x) * k}px;top:${pad + (fh - h) / 2 + (m.y - c.y) * k}px">${i + 1}</span>`));
  document.body.dataset.ready = "1";
};
img.src = D.image || "";
</script></body></html>
