<!doctype html>
<!--
  before-after: two short code or config snippets side by side.
  Data keys: kicker, title, before{label, lines[]}, after{label, lines[]}, takeaway, height.
  A line is a string or {t: "...", hl: "bad"|"good"}. Lines starting with // or # are drawn as comments.
  Keep each snippet to about 8 lines of at most 36 characters.
-->
<html lang="en"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Inter";src:url("../../../assets/fonts/Inter-Medium.ttf");font-weight:500}
@font-face{font-family:"Inter";src:url("../../../assets/fonts/Inter-SemiBold.ttf");font-weight:600}
@font-face{font-family:"IBM Plex Mono";src:url("../../../assets/fonts/IBMPlexMono-Medium.ttf");font-weight:500}
@font-face{font-family:"Inter Display";src:url("../../../assets/fonts/InterDisplay-Bold.ttf");font-weight:700}
:root{--navy:#11151D;--teal:#2DD4BF;--teal-ink:#0F766E;--teal-bg:#E3F8F4;--amber:#FBBF24;--amber-bg:#FEF5DC;
  --bad:#B42318;--bad-bg:#FCEBE9;--ink:#11151D;--muted:#566070;--bg:#F5F7FA;--card:#FFFFFF;--line:#DCE2EA;
  --mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
#card{width:1280px;height:720px;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);
  font:500 30px/1.4 "Inter",sans-serif;overflow:hidden}
.bar{background:var(--navy);color:#fff;padding:36px 64px 34px;position:relative;flex:none}
.bar::after{content:"";position:absolute;left:64px;bottom:0;width:140px;height:6px;background:var(--teal);border-radius:3px 3px 0 0}
.kicker{font:600 28px/1 "Inter";letter-spacing:.03em;color:var(--teal)}
h1{font:700 54px/1.12 "Inter Display";letter-spacing:-.01em;margin-top:14px}
main{flex:1;min-height:0;padding:36px 48px 0;display:flex}
.take{flex:none;margin:28px 48px 36px;padding:22px 30px;border-left:8px solid var(--amber);background:var(--amber-bg);
  border-radius:0 14px 14px 0;font:600 30px/1.35 "Inter"}
code{font-family:var(--mono);font-weight:500;font-size:.92em}
strong{font-weight:600}

.panes{display:grid;grid-template-columns:1fr 1fr;gap:32px;width:100%}
.pane{background:var(--card);border:2px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.pane.after{border-color:var(--teal-ink)}
.pane header{display:flex;align-items:center;gap:16px;padding:22px 28px;font:700 32px/1.2 "Inter Display";border-bottom:2px solid var(--line)}
.badge{flex:none;width:44px;height:44px;border-radius:50%;color:#fff;font:700 26px/44px "Inter";text-align:center}
.before .badge{background:var(--bad)} .after .badge{background:var(--teal-ink)}
pre{font:500 24px/1.6 var(--mono);padding:20px 0;white-space:pre;flex:1;tab-size:4;
  font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
.ln{display:block;padding:0 26px 0 22px;border-left:6px solid transparent}
.ln.c{color:#6B7380}
.ln.bad{background:var(--bad-bg);border-left-color:var(--bad);color:#7A1A12}
.ln.good{background:var(--teal-bg);border-left-color:var(--teal-ink);color:#0B4F49}
</style></head>
<body><div id="card">
  <div class="bar"><div class="kicker" id="kicker"></div><h1 id="title"></h1></div>
  <main><div class="panes" id="panes"></div></main>
  <div class="take" id="take"></div>
</div>
<script>
const D = window.DATA || {};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
document.documentElement.lang = D.lang || "en";
const card = document.getElementById("card");
card.style.width = (D.width || 1280) + "px";
// Without an explicit height the card grows with its content (at least 16:9).
if (D.height) card.style.height = D.height + "px";
else { card.style.height = "auto"; card.style.minHeight = "720px"; }
document.getElementById("kicker").innerHTML = md(D.kicker);
document.getElementById("title").innerHTML = md(D.title);
const take = document.getElementById("take");
if (D.takeaway) take.innerHTML = md(D.takeaway); else take.remove();
const pane = (cls, mark, p) => {
  const lines = (p.lines || []).map(l => {
    const o = typeof l === "string" ? {t: l} : l;
    const comment = /^\s*(\/\/|#)/.test(o.t);
    return `<span class="ln${comment ? " c" : ""}${o.hl ? " " + o.hl : ""}">${esc(o.t) || " "}</span>`;
  }).join("");
  return `<section class="pane ${cls}"><header><span class="badge">${mark}</span>${md(p.label)}</header>
    <pre class="fit">${lines}</pre></section>`;
};
document.getElementById("panes").innerHTML = pane("before", "✕", D.before || {}) + pane("after", "✓", D.after || {});
</script></body></html>
