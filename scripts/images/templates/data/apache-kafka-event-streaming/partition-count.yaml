template: steps
langs:
  en:
    kicker: "Kafka · topic orders, group billing"
    title: Within a group, each partition has one consumer
    steps:
      - label: Producer
        code: key hash
        text: The key's hash picks one of the topic's partitions.
      - label: Topic
        title: orders
        text: Partitions 0, 1 and 2, each with its own offsets.
      - label: Consumer group
        title: billing
        text: Consumer 1 reads partitions 0 and 1, consumer 2 reads partition 2.
