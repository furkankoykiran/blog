    kicker: "Kafka · orders topic'i, billing grubu"
    title: Bir grupta her partition'ı tek bir consumer okur
    steps:
      - label: Producer
        code: key hash
        text: Key'in hash'i, topic'in partition'larından birini seçer.
      - label: TOPIC
        title: orders
        text: Partition 0, 1 ve 2; her birinin kendi offset'leri var.
      - label: Consumer grubu
        title: billing
        text: Consumer 1, partition 0 ve 1'i; consumer 2, partition 2'yi okur.
    takeaway: 6 partition'lı bir topic'e 8 consumer bağlarsanız 2'si boşta bekler.
