# python scripts/images/render.py card scripts/images/templates/data/git-workflow-branching-strategies/gitflow-vs-trunk.yaml "content/{lang}/posts/git-workflow-branching-strategies/img/gitflow-vs-trunk.webp"
template: compare
langs:
  en:
    kicker: "Git · branching strategy"
    title: GitFlow or trunk-based?
    row_labels: [Long-lived branches, Branch lifetime, Unfinished work]
    use_label: Fits
    columns:
      - {name: GitFlow, rows: ["`main` and `develop`", "Often weeks, so branches drift apart", "Waits on `feature/*` and `release/*`"], use: "Several release lines, store review, on-premise"}
