    takeaway: Trunk-based work depends on CI. Tests run on every PR and a red build blocks the merge.
  tr:
    kicker: "Git · dallanma stratejisi"
    title: GitFlow mu, trunk-based mi?
    row_labels: [Kalıcı dallar, Dalın ömrü, Bitmemiş iş]
    use_label: Uygun
    columns:
      - {name: GitFlow, rows: ["`main` ve `develop`", "Çoğu zaman haftalar, dallar birbirinden uzaklaşır", "`feature/*` ve `release/*` dallarında bekler"], use: "Birden çok sürüm hattı, mağaza onayı, kurulumlu yazılım"}
      - {name: Trunk-based, pick: true, rows: ["Sadece `main`", "Saatler, en fazla bir iki gün", "Feature flag arkasında `main`’e girer"], use: Günde birkaç kez deploy edilen web servisi}
    takeaway: Trunk-based çalışma iyi CI ister. Her PR’da testler koşar, kırmızı build merge’ü engeller.
