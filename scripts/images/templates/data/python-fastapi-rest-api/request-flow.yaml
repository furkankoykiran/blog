# python scripts/images/render.py card scripts/images/templates/data/python-fastapi-rest-api/request-flow.yaml "content/{lang}/posts/python-fastapi-rest-api/img/request-flow.webp"
template: steps
langs:
  en:
    kicker: "FastAPI · POST /users"
    title: The path one request takes through main.py
    steps:
      - label: Validate
        code: "payload: UserCreate"
        text: "Pydantic checks EmailStr and a 2–100 character name. Bad input gets a 422."
      - label: Dependency
        code: "session: SessionDep"
        text: get_session yields an AsyncSession for this request.
      - label: Handler
        code: await session.commit()
        text: A duplicate email is caught as IntegrityError and returns 409, not 500.
      - label: Response
        code: response_model=UserRead
        text: "Only id, email and full_name leave the server, with a 201."
    takeaway: Add a password_hash column later and response_model keeps it from leaking.
  tr:
    kicker: "FastAPI · POST /users"
    title: Bir isteğin main.py içindeki yolu
    steps:
      - label: Doğrulama
        code: "payload: UserCreate"
        text: "Pydantic EmailStr’i ve 2–100 karakterlik adı kontrol eder. Hatalı girdi 422 alır."
      - label: Bağımlılık
        code: "session: SessionDep"
        text: get_session bu istek için bir AsyncSession verir.
      - label: Handler
        code: await session.commit()
        text: Aynı e-posta IntegrityError olarak yakalanır ve 500 yerine 409 döner.
      - label: Yanıt
        code: response_model=UserRead
        text: "Dışarı yalnızca id, email ve full_name çıkar, 201 ile."
    takeaway: Modele ileride password_hash eklerseniz response_model onun sızmasını engeller.
