<!doctype html>
<!--
  steps: 3-5 numbered steps. Up to 3 steps sit side by side with arrows; 4-5 steps form a list.
  Data keys: kicker, title, steps[{label, title, code, text}], takeaway, height.
  Every step field is optional; inline `code` and **bold** work in text fields.
-->
<html lang="en"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Inter";src:url("../../../assets/fonts/Inter-Medium.ttf");font-weight:500}
@font-face{font-family:"Inter";src:url("../../../assets/fonts/Inter-SemiBold.ttf");font-weight:600}
@font-face{font-family:"IBM Plex Mono";src:url("../../../assets/fonts/IBMPlexMono-Medium.ttf");font-weight:500}
@font-face{font-family:"Inter Display";src:url("../../../assets/fonts/InterDisplay-Bold.ttf");font-weight:700}
:root{--navy:#11151D;--teal:#2DD4BF;--teal-ink:#0F766E;--teal-bg:#E3F8F4;--amber:#FBBF24;--amber-bg:#FEF5DC;
  --ink:#11151D;--muted:#566070;--bg:#F5F7FA;--card:#FFFFFF;--line:#DCE2EA;--chip:#EDF1F5;
  --mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
#card{width:1280px;height:720px;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);
  font:500 30px/1.4 "Inter",sans-serif;overflow:hidden}
.bar{background:var(--navy);color:#fff;padding:36px 64px 34px;position:relative;flex:none}
.bar::after{content:"";position:absolute;left:64px;bottom:0;width:140px;height:6px;background:var(--teal);border-radius:3px 3px 0 0}
.kicker{font:600 28px/1 "Inter";letter-spacing:.03em;color:var(--teal)}
h1{font:700 54px/1.12 "Inter Display";letter-spacing:-.01em;margin-top:14px}
main{flex:1;min-height:0;padding:40px 64px 0;display:flex;align-items:center}
.take{flex:none;margin:28px 64px 36px;padding:22px 30px;border-left:8px solid var(--amber);background:var(--amber-bg);
  border-radius:0 14px 14px 0;font:600 30px/1.35 "Inter"}
code{font-family:var(--mono);font-weight:500;font-size:.92em}
strong{font-weight:600}

.num{flex:none;width:64px;height:64px;border-radius:50%;background:var(--navy);color:var(--teal);
  font:700 32px/64px "Inter Display";text-align:center}
.label{font:600 19px/1 "Inter";letter-spacing:.12em;text-transform:uppercase;color:var(--teal-ink)}
.step h3{font:700 38px/1.18 "Inter Display"}
.chip{font:500 28px/1.3 var(--mono);background:var(--chip);border-radius:10px;padding:8px 16px;align-self:flex-start;color:var(--navy)}
.step p{font:500 29px/1.38 "Inter";color:#2A3240}

/* side by side */
.row{display:flex;align-items:stretch;width:100%}
.row .step{flex:1;min-width:0;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:30px 28px 28px;
  display:flex;flex-direction:column;gap:18px;overflow:hidden}
.row .top{display:flex;align-items:center;gap:20px}
.row .chip{font-size:25px}
.row .step h3{font-size:34px}
.arrow{flex:none;width:56px;display:flex;align-items:center;justify-content:center}

/* list */
.list{width:100%;display:flex;flex-direction:column;gap:22px;position:relative}
.list::before{content:"";position:absolute;left:31px;top:40px;bottom:40px;width:3px;background:var(--line)}
.list .step{display:grid;grid-template-columns:64px 1fr;column-gap:30px;align-items:center;position:relative;overflow:hidden}
.list .body{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:18px 28px;
  display:flex;align-items:center;gap:28px}
.list .head{flex:none;width:var(--head,auto);display:flex;flex-direction:column;gap:8px}
.list .chip{font-size:25px;white-space:nowrap}
.list p{flex:1;min-width:0}
</style></head>
<body><div id="card">
  <div class="bar"><div class="kicker" id="kicker"></div><h1 id="title"></h1></div>
  <main id="main"></main>
  <div class="take" id="take"></div>
</div>
<script>
const D = window.DATA || {};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
document.documentElement.lang = D.lang || "en";
const card = document.getElementById("card");
card.style.width = (D.width || 1280) + "px";
// Without an explicit height the card grows with its content (at least 16:9).
if (D.height) card.style.height = D.height + "px";
else { card.style.height = "auto"; card.style.minHeight = "720px"; }
document.getElementById("kicker").innerHTML = md(D.kicker);
document.getElementById("title").innerHTML = md(D.title);
const take = document.getElementById("take");
if (D.takeaway) take.innerHTML = md(D.takeaway); else take.remove();
const steps = D.steps || [];
const main = document.getElementById("main");
if (D.head_width) main.style.setProperty("--head", D.head_width + "px");
const ARROW = `<svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><path d="M6 22h28M24 11l11 11-11 11"
  fill="none" stroke="#0F766E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
if (steps.length <= 3) {
  main.innerHTML = `<div class="row">${steps.map((s, i) => `${i ? `<div class="arrow">${ARROW}</div>` : ""}
    <section class="step fit">
      <div class="top"><div class="num">${i + 1}</div>${s.label ? `<div class="label">${md(s.label)}</div>` : ""}</div>
      ${s.title ? `<h3>${md(s.title)}</h3>` : ""}
      ${s.code ? `<div class="chip">${esc(s.code)}</div>` : ""}
      ${s.text ? `<p>${md(s.text)}</p>` : ""}
    </section>`).join("")}</div>`;
} else {
  main.innerHTML = `<div class="list">${steps.map((s, i) => `<section class="step">
      <div class="num">${i + 1}</div>
      <div class="body fit">
        <div class="head">${s.label ? `<div class="label">${md(s.label)}</div>` : ""}
          ${s.title ? `<h3>${md(s.title)}</h3>` : ""}${s.code ? `<div class="chip">${esc(s.code)}</div>` : ""}</div>
        ${s.text ? `<p>${md(s.text)}</p>` : ""}
      </div></section>`).join("")}</div>`;
}
</script></body></html>
